name: parser-smoke-test

# Runs the files-mode smoke test over the parser notebook on every relevant
# change, plus the bundled Local CSV demo dataset.

on:
  push:
    paths:
      - 'fabric/notebooks/**'
      - 'data/**'
      - 'tools/**'
      - '.github/workflows/parser-smoke-test.yml'
  pull_request:
    paths:
      - 'fabric/notebooks/**'
      - 'data/**'
      - 'tools/**'
      - '.github/workflows/parser-smoke-test.yml'

jobs:
  smoke-test:
    name: Parse fixture + demo transcripts, assert every output table populates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --quiet pandas pyspark

      - name: Smoke test - bundled parser fixture
        working-directory: 'fabric/notebooks/samples'
        run: python smoketest_files_mode.py

      - name: Smoke test - demo transcripts
        working-directory: 'fabric/notebooks/samples'
        run: python smoketest_files_mode.py "../../../data/conversationtranscripts.csv"

      - name: Validate demo data populates every dashboard column
        working-directory: 'tools'
        run: python validate_sample_data.py
