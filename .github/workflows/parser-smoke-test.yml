name: parser-smoke-test

# Runs the files-mode smoke test over the parser notebook on every relevant
# change, plus the bundled Local CSV demo dataset.

on:
  push:
    paths:
      - '2. Fabric/notebooks/**'
      - '3. Local CSV/**'
      - '.github/workflows/parser-smoke-test.yml'
  pull_request:
    paths:
      - '2. Fabric/notebooks/**'
      - '3. Local CSV/**'
      - '.github/workflows/parser-smoke-test.yml'

jobs:
  smoke-test:
    name: Parse fixture + demo transcripts, assert every output table populates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --quiet pandas pyspark

      - name: Smoke test - bundled parser fixture
        working-directory: '2. Fabric/notebooks/samples'
        run: python smoketest_files_mode.py

      - name: Smoke test - Local CSV demo data
        working-directory: '2. Fabric/notebooks/samples'
        run: python smoketest_files_mode.py "../../../3. Local CSV/data/conversationtranscripts.csv"

      - name: Validate demo data populates every dashboard column
        working-directory: '3. Local CSV/tools'
        run: python validate_sample_data.py
